<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart – GiftHub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .cart-layout {
      max-width: 1060px;
      margin: 0 auto;
      padding: 3rem 2rem;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 2rem;
      align-items: start;
    }

    .cart-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .cart-header-row h1 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--charcoal);
    }

    .clear-cart-btn {
      background: none;
      border: none;
      font-family: var(--font-body);
      font-size: 0.8rem;
      color: var(--coral);
      cursor: pointer;
    }

    /* CART ITEMS */
    .cart-items { display: flex; flex-direction: column; gap: 1rem; }

    .cart-item {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 1.25rem;
      align-items: center;
      transition: all var(--transition);
    }

    .cart-item:hover { box-shadow: var(--shadow-card); }

    .cart-item-img {
      width: 80px;
      height: 80px;
      background: var(--cream-dark);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      flex-shrink: 0;
      border: 1.5px dashed var(--muted-light);
    }

    .cart-item-details { min-width: 0; }

    .cart-item-cat {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .cart-item-name {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      color: var(--charcoal);
      line-height: 1.3;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-price {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--amber-dark);
    }

    .cart-item-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.75rem;
    }

    .cart-item-total {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--charcoal);
    }

    .remove-btn {
      background: none;
      border: none;
      font-size: 0.75rem;
      color: var(--muted-light);
      cursor: pointer;
      transition: color var(--transition);
    }

    .remove-btn:hover { color: var(--coral); }

    /* ORDER SUMMARY */
    .order-summary {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      position: sticky;
      top: 80px;
    }

    .summary-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--charcoal);
      margin-bottom: 1.5rem;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0;
      font-size: 0.875rem;
      color: var(--charcoal-mid);
      border-bottom: 1px solid var(--border);
    }

    .summary-row:last-of-type { border-bottom: none; }

    .summary-row.total {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--charcoal);
      padding-top: 1rem;
      margin-top: 0.5rem;
      border-top: 2px solid var(--border-strong);
    }

    .summary-row.total span:last-child { color: var(--amber-dark); }

    .summary-promo {
      display: flex;
      gap: 8px;
      margin: 1rem 0;
    }

    .summary-promo input {
      flex: 1;
      padding: 0.65rem 1rem;
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.8rem;
      outline: none;
    }

    .summary-promo input:focus { border-color: var(--amber); }

    .summary-note {
      font-size: 0.72rem;
      color: var(--muted-light);
      text-align: center;
      margin-top: 1rem;
      line-height: 1.5;
    }

    .promo-badge {
      display: none;
      background: var(--coral-light);
      color: var(--coral);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      margin-bottom: 0.5rem;
    }

    .promo-badge.visible { display: inline-block; }

    /* FREE SHIPPING BANNER */
    .free-ship-bar {
      background: var(--amber-light);
      border: 1px solid rgba(232,160,48,0.3);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--amber-dark);
      margin-bottom: 1rem;
      text-align: center;
    }

    @media (max-width: 768px) {
      .cart-layout { grid-template-columns: 1fr; padding: 1.5rem 1rem; }
      .order-summary { position: static; }
      .cart-item { grid-template-columns: 64px 1fr; }
      .cart-item-controls { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
    }

    @media (max-width: 480px) {
      .cart-item-name { font-size: 0.88rem; }
    }
  </style>
</head>
<body>
  <div id="nav-root"></div>

  <div class="page-wrap">
    <div class="cart-layout">

      <!-- CART ITEMS -->
      <div>
        <div class="cart-header-row">
          <h1>Your Cart</h1>
          <button class="clear-cart-btn" onclick="clearAll()">Clear all</button>
        </div>
        <div id="cart-body"></div>
      </div>

      <!-- ORDER SUMMARY -->
      <div>
        <div class="order-summary" id="summary-box" style="display:none">
          <h2 class="summary-title">Order Summary</h2>

          <div id="free-ship-bar" class="free-ship-bar"></div>

          <div class="summary-row">
            <span>Subtotal</span>
            <span id="s-subtotal">₹0</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span id="s-shipping">₹99</span>
          </div>
          <div class="summary-row">
            <span>Gift Wrap</span>
            <span id="s-giftwrap">Free</span>
          </div>

          <div style="margin: 1rem 0;">
            <span class="promo-badge" id="promo-badge"></span>
            <div class="summary-promo">
              <input type="text" id="promo-input" placeholder="Promo code">
              <button class="btn btn-outline btn-sm" onclick="applyPromo()">Apply</button>
            </div>
          </div>

          <div class="summary-row">
            <span>Discount</span>
            <span id="s-discount" style="color:var(--coral)">–₹0</span>
          </div>

          <div class="summary-row total">
            <span>Total</span>
            <span id="s-total">₹0</span>
          </div>

          <a href="checkout.html" class="btn btn-primary btn-full" style="margin-top:1.25rem;font-size:1rem">Proceed to Checkout →</a>
          <a href="products.html" class="btn btn-outline btn-full" style="margin-top:0.75rem">Continue Shopping</a>

          <p class="summary-note">🔒 Secure checkout. Free gift wrapping on orders above ₹1,499.</p>
        </div>
      </div>

    </div>
  </div>

  <div id="footer-root"></div>

  <script src="app.js"></script>
  <script>
    document.getElementById('nav-root').innerHTML = renderNav('');
    document.getElementById('footer-root').innerHTML = renderFooter();

    let discount = 0;

    const PROMOS = { 'GIFTHUB10': 10, 'SWIFT20': 20, 'LOVE15': 15 };

    function renderCart() {
      const items = Cart.get();
      const body = document.getElementById('cart-body');
      const summaryBox = document.getElementById('summary-box');

      if (items.length === 0) {
        body.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🛍️</div>
            <h3>Your cart is empty</h3>
            <p>Discover gifts your people will love.</p>
            <a href="products.html" class="btn btn-primary">Browse Gifts</a>
          </div>`;
        summaryBox.style.display = 'none';
        return;
      }

      summaryBox.style.display = 'block';

      body.innerHTML = `<div class="cart-items">${items.map(item => {
        const p = PRODUCTS.find(x => x.id === item.id);
        if (!p) return '';
        const itemTotal = p.price * item.qty;
        return `
          <div class="cart-item" id="item-${p.id}">
            <div class="cart-item-img">
  <img src="${p.img}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">
</div>
            <div class="cart-item-details">
              <div class="cart-item-cat">${categoryLabel(p.category)}</div>
              <div class="cart-item-name">${p.name}</div>
              <div class="cart-item-price">₹${p.price.toLocaleString('en-IN')} each</div>
            </div>
            <div class="cart-item-controls">
              <div class="cart-item-total">₹${itemTotal.toLocaleString('en-IN')}</div>
              <div class="qty-control">
                <button class="qty-btn" onclick="updateQty('${p.id}', ${item.qty - 1})">−</button>
                <span class="qty-num">${item.qty}</span>
                <button class="qty-btn" onclick="updateQty('${p.id}', ${item.qty + 1})">+</button>
              </div>
              <button class="remove-btn" onclick="removeItem('${p.id}')">✕ Remove</button>
            </div>
          </div>`;
      }).join('')}</div>`;

      updateSummary();
    }

    function updateQty(id, qty) {
      if (qty < 1) { removeItem(id); return; }
      Cart.updateQty(id, qty);
      renderCart();
    }

    function removeItem(id) {
      Cart.remove(id);
      renderCart();
      showToast('Item removed from cart');
    }

    function clearAll() {
      if (confirm('Remove all items from your cart?')) {
        Cart.clear();
        renderCart();
      }
    }

    function updateSummary() {
      const subtotal = Cart.total();
      const shipping = subtotal >= 1499 ? 0 : 99;
      const discountAmt = Math.round(subtotal * discount / 100);
      const total = subtotal + shipping - discountAmt;

      document.getElementById('s-subtotal').textContent = '₹' + subtotal.toLocaleString('en-IN');
      document.getElementById('s-shipping').textContent = shipping === 0 ? 'FREE 🎉' : '₹' + shipping;
      document.getElementById('s-discount').textContent = '–₹' + discountAmt.toLocaleString('en-IN');
      document.getElementById('s-total').textContent = '₹' + total.toLocaleString('en-IN');

      // Free shipping bar
      const bar = document.getElementById('free-ship-bar');
      if (subtotal >= 1499) {
        bar.textContent = '🎉 You have free shipping!';
      } else {
        const remaining = 1499 - subtotal;
        bar.textContent = `Add ₹${remaining} more for free shipping`;
      }

      // Store total for checkout
      localStorage.setItem('gifthub_order_total', total);
      localStorage.setItem('gifthub_order_subtotal', subtotal);
    }

    function applyPromo() {
      const code = document.getElementById('promo-input').value.trim().toUpperCase();
      const badge = document.getElementById('promo-badge');
      if (PROMOS[code]) {
        discount = PROMOS[code];
        badge.textContent = `✓ ${code} applied – ${discount}% off`;
        badge.classList.add('visible');
        updateSummary();
        showToast(`✓ Promo code applied: ${discount}% off!`);
      } else {
        showToast('✗ Invalid promo code. Try GIFTHUB10');
      }
    }

    renderCart();
  </script>
</body>
</html>
