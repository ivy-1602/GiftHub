<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop All Gifts – GiftHub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .shop-header {
      background: var(--charcoal);
      padding: 3rem 2rem 2.5rem;
      text-align: center;
    }
    .shop-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--cream);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .shop-header p { color: rgba(253,246,237,0.6); font-size: 0.95rem; }

    .shop-layout {
      max-width: 1180px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 2.5rem;
      align-items: start;
    }

    /* FILTERS SIDEBAR */
    .filters {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      position: sticky;
      top: 80px;
    }

    .filter-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .filter-group { margin-bottom: 1.75rem; }

    .filter-group-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--charcoal);
      margin-bottom: 0.75rem;
    }

    .filter-pill-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-pill {
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: transparent;
      font-family: var(--font-body);
      font-size: 0.82rem;
      color: var(--charcoal-mid);
      cursor: pointer;
      transition: all var(--transition);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-pill:hover { border-color: var(--amber); background: var(--amber-light); }
    .filter-pill.active { border-color: var(--amber); background: var(--amber-light); color: var(--charcoal); font-weight: 600; }

    .filter-clear {
      background: none;
      border: none;
      font-family: var(--font-body);
      font-size: 0.78rem;
      color: var(--coral);
      cursor: pointer;
      padding: 0;
      margin-top: 0.5rem;
    }

    /* PRODUCT GRID AREA */
    .products-area {}

    .products-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .products-count {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .sort-select {
      padding: 8px 14px;
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.82rem;
      color: var(--charcoal);
      background: var(--white);
      cursor: pointer;
      outline: none;
    }

    /* MOBILE FILTER TOGGLE */
    .mobile-filter-btn {
      display: none;
      align-items: center;
      gap: 6px;
    }

    /* PRODUCT DETAIL MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30,26,22,0.55);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--white);
      border-radius: 20px;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(20px);
      transition: transform var(--transition);
    }

    .modal-overlay.open .modal { transform: translateY(0); }

    .modal-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .modal-img {
      aspect-ratio: 1;
      background: var(--cream-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      padding: 1.5rem;
      border-radius: 20px 0 0 20px;
    }

    .modal-img .ph-icon { font-size: 3rem; }
    .modal-img .ph-label { font-size: 0.8rem; font-weight: 600; color: var(--charcoal-mid); text-align: center; }
    .modal-img .ph-hint { font-size: 0.7rem; color: var(--muted-light); text-align: center; border: 1.5px dashed var(--muted-light); border-radius: 8px; padding: 8px; margin-top: 4px; }

    .modal-info { padding: 2rem; }

    .modal-close {
      display: block;
      margin-left: auto;
      background: var(--cream-dark);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      transition: background var(--transition);
    }

    .modal-close:hover { background: var(--border); }

    .modal-cat { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .modal-name { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: var(--charcoal); margin-bottom: 8px; line-height: 1.3; }
    .modal-price { font-size: 1.5rem; font-weight: 700; color: var(--amber-dark); margin-bottom: 1.25rem; }
    .modal-desc { font-size: 0.875rem; color: var(--muted); line-height: 1.7; margin-bottom: 1.5rem; }

    .modal-qty-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 900px) {
      .shop-layout { grid-template-columns: 1fr; }
      .filters { position: static; display: none; }
      .filters.open { display: block; }
      .mobile-filter-btn { display: flex; }
      .modal-body { grid-template-columns: 1fr; }
      .modal-img { border-radius: 20px 20px 0 0; aspect-ratio: 16/9; }
    }

    @media (max-width: 480px) {
      .shop-layout { padding: 1.5rem 1rem; }
      .products-toolbar { gap: 0.5rem; }
    }
  </style>
</head>
<body>
  <div id="nav-root"></div>

  <div class="shop-header">
    <h1>Shop All Gifts</h1>
    <p>Curated picks across tech, self-care, books & Taylor Swift vinyls.</p>
  </div>

  <div class="shop-layout">
    <!-- SIDEBAR -->
    <aside>
      <button class="btn btn-outline btn-sm mobile-filter-btn" onclick="document.querySelector('.filters').classList.toggle('open')">
        ⚙ Filters
      </button>
      <div class="filters">
        <div class="filter-title">Filter by</div>

        <div class="filter-group">
          <div class="filter-group-label">Category</div>
          <div class="filter-pill-group" id="cat-filters">
            <button class="filter-pill active" data-filter="cat" data-val="all">🎁 All Gifts</button>
            <button class="filter-pill" data-filter="cat" data-val="tech">🎧 Tech & Gadgets</button>
            <button class="filter-pill" data-filter="cat" data-val="selfcare">🌿 Self-Care</button>
            <button class="filter-pill" data-filter="cat" data-val="books">📖 Books</button>
            <button class="filter-pill" data-filter="cat" data-val="vinyl">🎵 TS Vinyls</button>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-group-label">Budget</div>
          <div class="filter-pill-group" id="budget-filters">
            <button class="filter-pill active" data-filter="budget" data-val="all">Any Budget</button>
            <button class="filter-pill" data-filter="budget" data-val="under500">Under ₹500</button>
            <button class="filter-pill" data-filter="budget" data-val="500-1500">₹500 – ₹1,500</button>
            <button class="filter-pill" data-filter="budget" data-val="1500-3000">₹1,500 – ₹3,000</button>
            <button class="filter-pill" data-filter="budget" data-val="3000+">₹3,000+</button>
          </div>
        </div>

        <button class="filter-clear" onclick="resetFilters()">✕ Clear all filters</button>
      </div>
    </aside>

    <!-- PRODUCTS -->
    <div class="products-area">
      <div class="products-toolbar">
        <span class="products-count" id="products-count">24 gifts</span>
        <select class="sort-select" id="sort-select" onchange="renderProducts()">
          <option value="default">Sort: Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name">Name: A–Z</option>
        </select>
      </div>
      <div class="grid-4" id="products-grid"></div>
      <div id="no-results" style="display:none" class="empty-state">
        <div class="empty-icon">🔍</div>
        <h3>No gifts found</h3>
        <p>Try a different filter or budget range.</p>
        <button class="btn btn-primary" onclick="resetFilters()">Clear Filters</button>
      </div>
    </div>
  </div>

  <!-- PRODUCT DETAIL MODAL -->
  <div class="modal-overlay" id="product-modal" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div id="footer-root"></div>

  <script src="app.js"></script>
  <script>
    document.getElementById('nav-root').innerHTML = renderNav('products');
    document.getElementById('footer-root').innerHTML = renderFooter();

    let activeCat = 'all';
    let activeBudget = 'all';

    // Check URL params
    const params = new URLSearchParams(window.location.search);
    if (params.get('cat')) activeCat = params.get('cat');

    function getFiltered() {
      let list = [...PRODUCTS];
      if (activeCat !== 'all') list = list.filter(p => p.category === activeCat);
      if (activeBudget !== 'all') list = list.filter(p => p.budget === activeBudget);
      const sort = document.getElementById('sort-select').value;
      if (sort === 'price-asc') list.sort((a,b) => a.price - b.price);
      if (sort === 'price-desc') list.sort((a,b) => b.price - a.price);
      if (sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name));
      return list;
    }

    function renderProducts() {
      const list = getFiltered();
      const grid = document.getElementById('products-grid');
      const noResults = document.getElementById('no-results');
      document.getElementById('products-count').textContent = `${list.length} gift${list.length !== 1 ? 's' : ''}`;
      if (list.length === 0) {
        grid.innerHTML = '';
        noResults.style.display = 'block';
      } else {
        noResults.style.display = 'none';
        grid.innerHTML = list.map(p => renderProductCardDetail(p)).join('');
      }
      // Sync filter pills
      document.querySelectorAll('[data-filter="cat"]').forEach(b => b.classList.toggle('active', b.dataset.val === activeCat));
      document.querySelectorAll('[data-filter="budget"]').forEach(b => b.classList.toggle('active', b.dataset.val === activeBudget));
    }

    function renderProductCardDetail(product) {
      return `
      <div class="product-card">
        <div class="product-img-wrap" style="cursor:pointer" onclick="openModal('${product.id}')">
          ${product.img
            ? `<img src="${product.img}" alt="${product.name}">`
            : `<div class="product-img-placeholder">
                <span class="ph-icon">${categoryIcon(product.category)}</span>
                <span class="ph-label">${product.name.split('–')[0].trim()}</span>
                <span class="ph-hint">${product.imgHint}</span>
              </div>`
          }
          ${product.tag ? `<span class="product-tag ${product.tagStyle}">${product.tag}</span>` : ''}
        </div>
        <div class="product-info">
          <p class="product-category">${categoryLabel(product.category)}</p>
          <h3 class="product-name">${product.name}</h3>
          <p class="product-price">₹${product.price.toLocaleString('en-IN')}</p>
          <div class="product-actions">
            <button class="btn btn-primary btn-sm" style="flex:1" onclick="Cart.add('${product.id}');this.textContent='Added ✓';setTimeout(()=>this.textContent='Add to Cart',1800)">Add to Cart</button>
            <button class="btn btn-outline btn-sm" onclick="openModal('${product.id}')">View</button>
          </div>
        </div>
      </div>`;
    }

    // Filter pill clicks
    document.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.filter === 'cat') activeCat = btn.dataset.val;
        if (btn.dataset.filter === 'budget') activeBudget = btn.dataset.val;
        renderProducts();
      });
    });

    function resetFilters() {
      activeCat = 'all';
      activeBudget = 'all';
      document.getElementById('sort-select').value = 'default';
      renderProducts();
    }

    // MODAL
    function openModal(id) {
      const p = PRODUCTS.find(x => x.id === id);
      if (!p) return;
      document.getElementById('modal-body').innerHTML = `
        <div class="modal-img">
  <img src="${p.img}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;border-radius:20px 0 0 20px;">
</div>
          <span class="ph-label">${p.name.split('–')[0].trim()}</span>
          <span class="ph-hint">📷 ${p.imgHint}</span>
        </div>
        <div class="modal-info">
          <button class="modal-close" onclick="closeModal()">✕</button>
          <div class="modal-cat">${categoryLabel(p.category)}</div>
          <h2 class="modal-name">${p.name}</h2>
          <div class="modal-price">₹${p.price.toLocaleString('en-IN')}</div>
          <p class="modal-desc">A thoughtfully curated gift perfect for the ${p.vibe.join(' & ')} type. Great for ${p.occasion.join(', ')} occasions.</p>
          <div class="modal-qty-row">
            <div class="qty-control">
              <button class="qty-btn" onclick="changeQty(-1)">−</button>
              <input class="qty-num" id="modal-qty" type="number" value="1" min="1">
              <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
          </div>
          <button class="btn btn-primary btn-full" onclick="addFromModal('${p.id}')">Add to Cart</button>
          <div style="margin-top:0.75rem;font-size:0.75rem;color:var(--muted);text-align:center">Free gift wrapping on orders over ₹1,499</div>
        </div>`;
      document.getElementById('product-modal').classList.add('open');
    }

    function closeModal(e) {
      if (!e || e.target === document.getElementById('product-modal')) {
        document.getElementById('product-modal').classList.remove('open');
      }
    }

    function changeQty(delta) {
      const el = document.getElementById('modal-qty');
      el.value = Math.max(1, parseInt(el.value) + delta);
    }

    function addFromModal(id) {
      const qty = parseInt(document.getElementById('modal-qty').value) || 1;
      Cart.add(id, qty);
    }

    // Init
    renderProducts();

    // Handle ?id= direct product open
    if (params.get('id')) openModal(params.get('id'));
  </script>
</body>
</html>
